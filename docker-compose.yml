services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: production-api/Dockerfile
    container_name: rag-api
    env_file:
      - .env
    environment:
      # Inside Compose DNS "localhost" means the actual container so we use service name
      OLLAMA_HOST: http://ollama:11434
      PRIMARY_MODEL: ${PRIMARY_MODEL:-llama3:8b}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-llama3.2:3b}
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ollama_models:
